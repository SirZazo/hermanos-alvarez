<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Verificación de seguridad</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    defer>
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #turnstile-container {
      min-height: 70px;
    }
  </style>
</head>

<body>
  <div id="turnstile-container"></div>

  <script>
    (() => {
      function enviarFlutter(tipo, valor) {
        if (
          window.TurnstileChannel &&
          window.TurnstileChannel.postMessage
        ) {
          window.TurnstileChannel.postMessage(
            JSON.stringify({
              type: tipo,
              value: valor
            })
          );
        }
      }

      function esperarTurnstile() {
        return new Promise((resolve, reject) => {
          const inicio = Date.now();

          const comprobar = () => {
            if (window.turnstile) {
              resolve();
              return;
            }

            if (Date.now() - inicio > 10000) {
              reject(
                new Error(
                  'Cloudflare Turnstile no está disponible.'
                )
              );
              return;
            }

            setTimeout(comprobar, 50);
          };

          comprobar();
        });
      }

      async function iniciar() {
        try {
          await esperarTurnstile();

          const parametros =
            new URLSearchParams(window.location.search);

          const siteKey = parametros.get('sitekey');

          if (!siteKey) {
            enviarFlutter(
              'error',
              'Falta la Site Key de Turnstile.'
            );
            return;
          }

          const widgetId = window.turnstile.render(
            '#turnstile-container',
            {
              sitekey: siteKey,
              action: 'solicitud_discrecional',
              execution: 'execute',
              appearance: 'interaction-only',
              language: 'es',

              callback: function(token) {
                enviarFlutter('token', token);
              },

              'error-callback': function(errorCode) {
                enviarFlutter(
                  'error',
                  errorCode || 'desconocido'
                );

                return true;
              },

              'expired-callback': function() {
                enviarFlutter(
                  'error',
                  'La verificación ha caducado.'
                );
              },

              'timeout-callback': function() {
                enviarFlutter(
                  'error',
                  'La verificación ha agotado el tiempo.'
                );
              },

              'unsupported-callback': function() {
                enviarFlutter(
                  'error',
                  'WebView no compatible con Turnstile.'
                );
              }
            }
          );

          window.turnstile.execute(widgetId);
        } catch (error) {
          let detalle = 'Error desconocido';

          if (error && error.message) {
            detalle = error.message;
          } else {
            detalle = String(error);
          }

          enviarFlutter(
            'error',
            'Inicialización: ' + detalle
          );
        }
      }

      iniciar();
    })();
  </script>
</body>
</html>

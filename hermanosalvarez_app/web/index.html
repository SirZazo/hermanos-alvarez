<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hermanosalvarez_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hermanosalvarez_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    defer>
  </script>

  <div
    id="turnstile-container"
    style="
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2147483647;
    ">
  </div>

  <script>
    (() => {
      let widgetId = null;
      let currentSiteKey = null;
      let pendingVerification = null;

      function waitForTurnstile() {
        return new Promise((resolve, reject) => {
          const startedAt = Date.now();

          const check = () => {
            if (window.turnstile) {
              resolve();
              return;
            }

            if (Date.now() - startedAt > 8000) {
              reject(
                new Error('Cloudflare Turnstile no está disponible.')
              );
              return;
            }

            setTimeout(check, 50);
          };

          check();
        });
      }

      function resolvePending(token) {
        if (!pendingVerification) {
          return;
        }

        const pending = pendingVerification;
        pendingVerification = null;

        clearTimeout(pending.timeout);
        pending.resolve(token);
      }

      function rejectPending(message) {
        if (!pendingVerification) {
          return;
        }

        const pending = pendingVerification;
        pendingVerification = null;

        clearTimeout(pending.timeout);
        pending.reject(new Error(message));
      }

      window.getTurnstileToken = async function(siteKey) {
        await waitForTurnstile();

        if (!siteKey) {
          throw new Error('Falta la Site Key de Turnstile.');
        }

        if (
          widgetId === null ||
          currentSiteKey !== siteKey
        ) {
          if (widgetId !== null) {
            try {
              window.turnstile.remove(widgetId);
            } catch (_) {
              // No bloqueamos la nueva verificación.
            }
          }

          currentSiteKey = siteKey;

          widgetId = window.turnstile.render(
            '#turnstile-container',
            {
              sitekey: siteKey,
              action: 'solicitud_discrecional',
              execution: 'execute',
              appearance: 'interaction-only',
              language: 'es',

              callback: function(token) {
                resolvePending(token);
              },

              'error-callback': function() {
                rejectPending(
                  'Cloudflare no ha podido verificar la solicitud.'
                );
              },

              'expired-callback': function() {
                rejectPending(
                  'La verificación de seguridad ha caducado.'
                );
              },

              'timeout-callback': function() {
                rejectPending(
                  'La verificación de seguridad ha agotado el tiempo.'
                );
              }
            }
          );
        } else {
          window.turnstile.reset(widgetId);
        }

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            if (!pendingVerification) {
              return;
            }

            pendingVerification = null;

            reject(
              new Error(
                'La verificación de seguridad ha agotado el tiempo.'
              )
            );
          }, 120000);

          pendingVerification = {
            resolve: resolve,
            reject: reject,
            timeout: timeout
          };

          window.turnstile.execute(widgetId);
        });
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
